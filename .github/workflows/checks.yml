name: Checks

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"

      - name: Check backend dependency consistency
        working-directory: backend
        run: python -m pip check

      - name: Audit backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip_audit --skip-editable

      - name: Run Ruff
        working-directory: backend
        run: python -m ruff check app tests

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=85

      - name: Run deterministic retrieval evaluation
        working-directory: backend
        run: python -m app.evaluation.run

      - name: Run HTTP workflow smoke test
        run: python scripts/smoke_test.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build
