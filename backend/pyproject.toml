[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag-platform-backend"
version = "1.0.0"
description = "Backend foundation for the Agentic RAG Platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "pypdf>=5.0,<7.0",
  "prometheus-client>=0.20,<1.0",
  "rank-bm25>=0.2,<1.0",
  "qdrant-client>=1.12,<2.0",
  "sentence-transformers>=3.0,<6.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "pytest>=9.0.3,<10.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.6,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
per-file-ignores = {"app/api/routes/*.py" = ["B008"]}

[tool.setuptools.packages.find]
include = ["app*"]
